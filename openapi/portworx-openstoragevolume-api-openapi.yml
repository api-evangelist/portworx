            snapshot may increase the free storage available by this amount.'
          format: int64
          type: string
        shared_bytes:
          format: int64
          title: Storage consumed by this snapshot that is shared with parent and children
          type: string
        total_bytes:
          format: int64
          title: TotalBytes used by this volume
          type: string
      type: object
    apiVolumeLocator:
      description: 'VolumeLocator is a structure that is attached to a volume

        and is used to carry opaque metadata.'
      properties:
        group:
          $ref: '#/components/schemas/apiGroup'
        name:
          title: User friendly identifier
          type: string
        ownership:
          $ref: '#/components/schemas/apiOwnership'
        volume_ids:
          items:
            type: string
          title: Volume Ids to match
          type: array
        volume_labels:
          additionalProperties:
            type: string
          title: A set of name-value pairs that acts as search filters
          type: object
      type: object
    apiGroup:
      description: 'Group represents VolumeGroup / namespace

        All volumes in the same group share this object.'
      properties:
        id:
          description: Id common identifier across volumes that have the same group.
          type: string
      type: object
    apiCatalog:
      properties:
        LastModified:
          format: date-time
          title: Last Modified
          type: string
        children:
          items:
            $ref: '#/components/schemas/apiCatalog'
          title: Children
          type: array
        name:
          title: Name of the Directory/File
          type: string
        path:
          title: Full Path of the Directory/File
          type: string
        size:
          format: uint64
          title: File or Directory Size
          type: string
        type:
          title: Type Directory or File
          type: string
      type: object
    apiIoProfile:
      default: IO_PROFILE_SEQUENTIAL
      enum:
      - IO_PROFILE_SEQUENTIAL
      - IO_PROFILE_RANDOM
      - IO_PROFILE_DB
      - IO_PROFILE_DB_REMOTE
      - IO_PROFILE_CMS
      - IO_PROFILE_SYNC_SHARED
      - IO_PROFILE_AUTO
      - IO_PROFILE_NONE
      - IO_PROFILE_JOURNAL
      - IO_PROFILE_AUTO_JOURNAL
      type: string
    apiReplicaSet:
      properties:
        id:
          format: int64
          title: ID is the unique ID of this replica set
          type: integer
        nodes:
          items:
            type: string
          type: array
        pool_uuids:
          items:
            type: string
          title: Unique IDs of the storage pools for this replica set
          type: array
      title: 'ReplicaSet set of machine IDs (nodes) to which part of this volume is erasure

        coded - for clustered storage arrays'
      type: object
    apiNearSyncReplicationStrategy:
      default: NEAR_SYNC_STRATEGY_NONE
      enum:
      - NEAR_SYNC_STRATEGY_NONE
      - NEAR_SYNC_STRATEGY_AGGRESSIVE
      - NEAR_SYNC_STRATEGY_OPTIMIZED
      type: string
    apiLabelSelectorRequirement:
      description: 'LabelSelectorRequirement is a selector that contains values, a key, and an operator that

        relates the key and values.'
      properties:
        key:
          description: Key is the label key that the selector applies to.
          type: string
        operator:
          $ref: '#/components/schemas/LabelSelectorRequirementOperator'
        values:
          description: 'Values is an array of string values. If the operator is In or NotIn,

            the values array must be non-empty. If the operator is Exists or DoesNotExist,

            the values array must be empty. This array is replaced during a strategic

            merge patch.'
          items:
            type: string
          type: array
      type: object
    apiFastpathStatus:
      default: FASTPATH_UNKNOWN
      description: "- FASTPATH_UNKNOWN: backward compatible state\n - FASTPATH_ACTIVE: fastpath activated and enabled\n - FASTPATH_INACTIVE: fastpath inactive\n - FASTPATH_UNSUPPORTED: fastpath unsupported, disabled\n - FASTPATH_PENDING: fastpath operation setup in progress\n - FASTPATH_ERRORED: fastpath error'd, possible stuck failure"
      enum:
      - FASTPATH_UNKNOWN
      - FASTPATH_ACTIVE
      - FASTPATH_INACTIVE
      - FASTPATH_UNSUPPORTED
      - FASTPATH_PENDING
      - FASTPATH_ERRORED
      title: fastpath extensions
      type: string
    apiSdkVolumeCreateRequest:
      description: 'Defines a request to create a volume. Use OpenStorageVolume.Update()

        to update any labels on the volume.'
      properties:
        labels:
          additionalProperties:
            type: string
          title: Labels to apply to the volume
          type: object
        name:
          description: Unique name of the volume. This will be used for idempotency.
          type: string
        spec:
          $ref: '#/components/schemas/apiVolumeSpec'
      type: object
    apiSharedv4FailoverStrategyValue:
      default: UNSPECIFIED
      description: " - UNSPECIFIED: Unspecified\n - AGGRESSIVE: Fail over to the new NFS server quickly. This is appropriate for\nthe apps with sharedv4 service volumes. It can also be used\nfor the apps with sharedv4 volumes when such apps are able\nto restart quickly.\n - NORMAL: Give the old NFS server more time to come back up before\ntriggering the failover. This is appropriate for the apps\nwith sharedv4 volumes (non-service)."
      enum:
      - UNSPECIFIED
      - AGGRESSIVE
      - NORMAL
      type: string
    apiReport:
      properties:
        directories:
          format: int64
          title: Directory count
          type: string
        files:
          format: int64
          title: File count
          type: string
      type: object
    apiSdkVolumeCloneRequest:
      properties:
        additional_labels:
          additionalProperties:
            type: string
          description: 'Additional labels to be appended after cloning the volume. Note that clone will

            issue a snapshot, which copies most labels except pvc and namespace. This map

            allows you to pass additional labels that are not part of the parent volume.'
          type: object
        name:
          description: Unique name of the volume. This will be used for idempotency.
          type: string
        parent_id:
          description: Parent volume id or snapshot id will create a new volume as a clone of the parent.
          type: string
      title: Defines a request to clone a volume or create a volume from a snapshot
      type: object
    apiOwnership:
      description: 'Ownership information for resource.

        Administrators are users who belong to the group `*`, meaning, every group.'
      properties:
        acls:
          $ref: '#/components/schemas/OwnershipAccessControl'
        owner:
          description: 'Username of owner.


            The storage system uses the username taken from the security authorization

            token and is saved on this field. Only users with system administration

            can edit this value.'
          type: string
      type: object
    apiMountOptions:
      description: MountOptions defines the mount options with which a volume is mounted.
      properties:
        options:
          additionalProperties:
            type: string
          title: 'Options are opaque key value pairs that are passed as mount options when

            a volume is mounted.

            If an empty value is provided only the key will be passed as an option

            If both key and value are provided then ''key=value'' will be passed as an

            option'
          type: object
      type: object
    apiSdkVolumeUpdateResponse:
      title: Empty response
      type: object
    apiSdkVolumeEnumerateResponse:
      properties:
        volume_ids:
          items:
            type: string
          title: List of volumes matching label
          type: array
      title: Defines the response when listing volumes
      type: object
    apiExportProtocol:
      default: INVALID
      description: "ExportProtocol defines how the device is exported..\n\n - INVALID: Invalid uninitialized value\n - PXD: PXD the volume is exported over Portworx block interface.\n - ISCSI: ISCSI the volume is exported over ISCSI.\n - NFS: NFS the volume is exported over NFS.\n - CUSTOM: Custom the volume is exported over custom interface."
      enum:
      - INVALID
      - PXD
      - ISCSI
      - NFS
      - CUSTOM
      type: string
    apiSdkVolumeCapacityUsageResponse:
      properties:
        capacity_usage_info:
          $ref: '#/components/schemas/apiCapacityUsageInfo'
      title: Defines response containing volume/snapshot capacity usage details
      type: object
    apiSharedv4ServiceSpec:
      description: 'Sharedv4ServiceSpec when set, creates a service endpoint for accessing

        a sharedv4 volume.'
      properties:
        external_access:
          title: Indicates whether the service needs to be accessed outside of the cluster
          type: boolean
        name:
          title: 'Name of the service. If not provided the name of the volume will be

            used for setting up a service'
          type: string
        type:
          $ref: '#/components/schemas/Sharedv4ServiceSpecServiceType'
      type: object
    apiVolumePlacementSpec:
      properties:
        enforcement:
          $ref: '#/components/schemas/apiEnforcementType'
        match_expressions:
          description: MatchExpressions is a list of label selector requirements. The requirements are ANDed.
          items:
            $ref: '#/components/schemas/apiLabelSelectorRequirement'
          type: array
        topology_key:
          title: 'TopologyKey key for the matching all segments of the cluster topology with the same key

            e.g If the key is failure-domain.beta.kubernetes.io/zone, this should match all nodes with

            the same value for this key (i.e in the same zone)'
          type: string
        weight:
          format: int64
          title: 'Weight defines the weight of the rule which allows to break the tie with other matching rules. A rule with

            higher weight wins over a rule with lower weight.

            (optional)'
          type: string
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
